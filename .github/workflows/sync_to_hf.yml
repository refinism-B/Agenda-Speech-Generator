name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 將「你的帳號」與「專案名」替換掉
          git push --force https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/bevisrefiner/Agenda-Speech-Generator main